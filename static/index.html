<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF RAG Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 0.2rem;
    }
    .subtitle {
      color: #555;
      margin-bottom: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h2 {
      margin-top: 0;
      margin-bottom: 0.6rem;
      font-size: 1.1rem;
    }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }
    input[type="file"],
    input[type="text"],
    textarea {
      width: 100%;
      margin-bottom: 0.8rem;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font: inherit;
    }
    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font: inherit;
      background: #2563eb;
      color: white;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .row input[type="text"] {
      flex: 1;
      margin-bottom: 0;
    }
    .small {
      font-size: 0.8rem;
      color: #666;
    }
    #answer {
      white-space: pre-wrap;
    }
    .status {
      font-size: 0.85rem;
      color: #2563eb;
      margin-top: 0.4rem;
    }
    .error {
      color: #b91c1c;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>PDF RAG Platform</h1>
  <div class="subtitle">
    Upload a PDF, create a private knowledge base, and ask questions about your document.
  </div>

  <div class="card">
    <h2>1. Upload PDF & create knowledge base</h2>
    <form id="create-kb-form">
      <label for="pdf-file">PDF file</label>
      <input type="file" id="pdf-file" name="file" accept="application/pdf" required />

      <button type="submit" id="create-kb-btn">Create knowledge base</button>
      <div id="create-kb-status" class="status"></div>
    </form>

    <!-- kb_id скрыт от пользователя, но используется в JS -->
    <div class="hidden" style="margin-top: 0.8rem;">
      <label for="kb-id">Knowledge base ID (kb_id)</label>
      <input type="text" id="kb-id" readonly placeholder="kb_id will appear here after upload" />
      <div class="small">
        Save this ID – you will use it to ask questions later.
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Ask questions</h2>
    <form id="ask-form">
      <!-- Поле kb_id тоже скрыто, но остаётся для отправки на /ask -->
      <div class="hidden">
        <label for="kb-id-input">Knowledge base ID (kb_id)</label>
        <input type="text" id="kb-id-input" required placeholder="Paste your kb_id here" />
      </div>

      <label for="question">Question</label>
      <textarea id="question" rows="3" required placeholder="Ask a question about your PDF (you can use English or Russian)..."></textarea>

      <button type="submit" id="ask-btn">Ask</button>
      <div id="ask-status" class="status"></div>
    </form>

    <h3>Answer</h3>
    <div id="answer"></div>
  </div>

  <script>
    const createKbForm = document.getElementById("create-kb-form");
    const createKbBtn = document.getElementById("create-kb-btn");
    const createKbStatus = document.getElementById("create-kb-status");
    const kbIdField = document.getElementById("kb-id");

    const askForm = document.getElementById("ask-form");
    const askBtn = document.getElementById("ask-btn");
    const askStatus = document.getElementById("ask-status");
    const kbIdInput = document.getElementById("kb-id-input");
    const questionInput = document.getElementById("question");
    const answerBox = document.getElementById("answer");

    // Copy kb_id from first block to second automatically (хотя оба скрыты)
    kbIdField.addEventListener("input", () => {
      kbIdInput.value = kbIdField.value;
    });

    createKbForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      createKbStatus.textContent = "";
      createKbStatus.classList.remove("error");
      const fileInput = document.getElementById("pdf-file");
      if (!fileInput.files.length) {
        createKbStatus.textContent = "Please select a PDF file.";
        createKbStatus.classList.add("error");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      createKbBtn.disabled = true;
      createKbStatus.textContent = "Uploading and creating knowledge base...";

      try {
        const resp = await fetch("/create-kb", {
          method: "POST",
          body: formData,
        });

        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(text || "Request failed");
        }

        const data = await resp.json();
        kbIdField.value = data.kb_id || "";
        kbIdInput.value = data.kb_id || "";
        createKbStatus.textContent = "Knowledge base created. You can now ask questions below.";
      } catch (err) {
        console.error(err);
        createKbStatus.textContent = "Error creating knowledge base.";
        createKbStatus.classList.add("error");
      } finally {
        createKbBtn.disabled = false;
      }
    });

    askForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      askStatus.textContent = "";
      askStatus.classList.remove("error");
      answerBox.textContent = "";

      const kbId = kbIdInput.value.trim();
      const question = questionInput.value.trim();

      if (!kbId || !question) {
        askStatus.textContent = "Knowledge base is not ready yet.";
        askStatus.classList.add("error");
        return;
      }

      const formData = new FormData();
      formData.append("kb_id", kbId);
      formData.append("question", question);

      askBtn.disabled = true;
      askStatus.textContent = "Thinking...";

      try {
        const resp = await fetch("/ask", {
          method: "POST",
          body: formData,
        });

        if (!resp.ok) {
          const text = await resp.text();
          throw new Error(text || "Request failed");
        }

        const data = await resp.json();
        answerBox.textContent = data.answer || "(no answer)";
        askStatus.textContent = "Done.";
      } catch (err) {
        console.error(err);
        askStatus.textContent = "Error while asking.";
        askStatus.classList.add("error");
      } finally {
        askBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
